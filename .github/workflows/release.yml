# Builds AirEcho for macOS (.dmg), Linux (.AppImage), and Windows (.exe), and publishes
# them as a GitHub release — see docs/releasing.md.
#
# Every push to main (= every merged pull request) builds all six. A release is created
# only for a version that has none yet: bump `version` in Cargo.toml to release.
# Otherwise the binaries are still downloadable from the run's artifacts.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released — building only. Bump the version in Cargo.toml to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux ${{ matrix.arch }} (AppImage)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # GTK 4.22 / libadwaita 1.9 (the crates' gnome_50 / v1_9 features) need a GNOME 50 distro
    container: ubuntu:26.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-cargo-
      - name: Build AppImage
        run: scripts/build-appimage.sh --install-deps
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (dmg)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew has Quartz GTK bottles for Apple Silicon only
          - runner: macos-15
            arch: arm64
            packages: homebrew
          # Intel: MacPorts, GTK built with +quartz (its binary packages are +x11)
          - runner: macos-15-intel
            arch: x86_64
            packages: macports
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK (Homebrew)
        if: matrix.packages == 'homebrew'
        run: |
          brew install gtk4 libadwaita blueprint-compiler adwaita-icon-theme librsvg dylibbundler pkgconf

      # Building GTK takes a while, so /opt/local is cached; bump the -vN suffix to rebuild.
      # The cache is restored as the runner user, which can't create /opt/local itself.
      - name: Prepare /opt/local
        if: matrix.packages == 'macports'
        run: |
          sudo mkdir -p /opt/local
          sudo chown "$USER" /opt/local
      - name: Restore MacPorts
        if: matrix.packages == 'macports'
        id: macports-cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/local
          key: macports-${{ matrix.runner }}-gtk4-libadwaita-v1
      - name: Install GTK (MacPorts)
        if: matrix.packages == 'macports' && steps.macports-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          sudo installer -pkg MacPorts-2.12.7-15-Sequoia.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port -N selfupdate
          sudo port -N install gtk4 +quartz
          sudo port -N install libadwaita blueprint-compiler adwaita-icon-theme librsvg dylibbundler pkgconfig
          sudo rm -rf /opt/local/var/macports/build /opt/local/var/macports/distfiles
          sudo chown -R "$USER" /opt/local
      - name: Save MacPorts
        if: matrix.packages == 'macports' && steps.macports-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/local
          key: ${{ steps.macports-cache.outputs.cache-primary-key }}
      - name: Use MacPorts only
        if: matrix.packages == 'macports'
        run: |
          # The runner's Homebrew (/usr/local) must not be picked up: two GLibs in one
          # process crash at startup
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_LIBDIR=/opt/local/lib/pkgconfig:/opt/local/share/pkgconfig" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ matrix.arch }}-cargo-
      - name: Build dmg
        run: scripts/build-macos-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x86_64 (installer)
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          location: C:\msys64
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: Build and package Windows installer
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          $msys = Join-Path $env:MSYS2_LOCATION "ucrt64"
          $env:PATH = "$msys\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys\lib\pkgconfig;$msys\share\pkgconfig"
          $env:PKG_CONFIG = "$msys\bin\pkg-config.exe"
          $env:CC = "$msys\bin\gcc.exe"
          $env:AR = "$msys\bin\ar.exe"
          cargo build --release --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bundle = Join-Path $PWD "target\windows-bundle-x86_64"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1 `
            -Msys2Root $env:MSYS2_LOCATION `
            -Environment ucrt64 `
            -Executable "target\x86_64-pc-windows-gnu\release\airecho.exe" `
            -OutputDirectory $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          $output = Join-Path $PWD "dist"
          & $iscc "/DAppVersion=$env:VERSION" "/DAppArch=x86_64" "/DBundleDir=$bundle" `
            "/DOutputDir=$output" scripts\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 (installer)
    needs: version
    runs-on: windows-11-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          location: C:\msys64
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-lld
            mingw-w64-clang-aarch64-llvm
            mingw-w64-clang-aarch64-libunwind
            mingw-w64-clang-aarch64-gtk4
            mingw-w64-clang-aarch64-libadwaita
            mingw-w64-clang-aarch64-blueprint-compiler
            mingw-w64-clang-aarch64-glib2
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-adwaita-icon-theme

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-gnullvm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-arm64-cargo-

      - name: Build and package Windows ARM64 installer
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          $msys = Join-Path $env:MSYS2_LOCATION "clangarm64"
          $env:PATH = "$msys\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$msys\lib\pkgconfig;$msys\share\pkgconfig"
          $env:PKG_CONFIG = "$msys\bin\pkg-config.exe"
          $env:CC = "$msys\bin\clang.exe"
          $env:AR = "$msys\bin\llvm-ar.exe"
          $env:CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER = "$msys\bin\clang.exe"
          cargo build --release --target aarch64-pc-windows-gnullvm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bundle = Join-Path $PWD "target\windows-bundle-arm64"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1 `
            -Msys2Root $env:MSYS2_LOCATION `
            -Environment clangarm64 `
            -Executable "target\aarch64-pc-windows-gnullvm\release\airecho.exe" `
            -OutputDirectory $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6\ISCC.exe"
          $output = Join-Path $PWD "dist"
          & $iscc "/DAppVersion=$env:VERSION" "/DAppArch=arm64" "/DBundleDir=$bundle" `
            "/DOutputDir=$output" scripts\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, linux, macos, windows, windows-arm64]
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "AirEcho $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes
