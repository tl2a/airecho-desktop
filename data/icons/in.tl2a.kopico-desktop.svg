<?xml version="1.0" encoding="UTF-8"?>
<!-- Kopico Desktop app icon (placeholder artwork). Source for the Linux icon and the
     macOS AppIcon.icns (scripts/make-icons.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57e389"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- clipboard -->
  <rect x="34" y="28" width="60" height="76" rx="10" fill="#ffffff"/>
  <rect x="48" y="20" width="32" height="16" rx="6" fill="#deddda" stroke="#ffffff" stroke-width="4"/>
  <!-- send / receive arrows -->
  <g fill="none" stroke="#26a269" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 56 H80 M70 46 L80 56 L70 66"/>
    <path d="M82 84 H48 M58 74 L48 84 L58 94"/>
  </g>
</svg>
