[package]
name = "kopico-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
# libadwaita 0.9 is built against gtk4 0.11 — keep these two in lockstep.
# Feature flags set the *minimum system library* versions (GTK 4.22 / libadwaita 1.9).
gtk4 = { version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
# The default `libappindicator` backend loads GTK 3, which cannot coexist with GTK 4
# in one process. `ksni` (D-Bus StatusNotifierItem) is used on Linux instead; the
# feature has no effect on macOS/Windows.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Platform-aware home/download directory paths (used by the receiver module)
dirs-next = "2"
